<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">Ledger architecture and storage boundaries</title><desc id="desc">Browser app stores transactions in IndexedDB and settings in localStorage. Python CLI uses SQLite. There is no sync. CSV and JSON are user-managed exports; GitHub Pages and manual Cloudflare deployments are separate.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#648071"/></marker></defs><rect width="1120" height="500" rx="24" fill="#f4f7f5"/><text x="42" y="46" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17251e">Ledger architecture</text><text x="42" y="70" font-family="Arial,sans-serif" font-size="13" fill="#596b60">Two interfaces · local data stores · no automatic synchronization</text>
<rect x="42" y="95" width="495" height="285" rx="18" fill="#fff" stroke="#cbd9cf" stroke-width="1.5"/><rect x="42" y="95" width="495" height="48" rx="18" fill="#173b2d"/><path d="M42 125H537V143H42Z" fill="#173b2d"/><text x="66" y="125" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Browser app · site/</text>
<rect x="66" y="164" width="447" height="58" rx="10" fill="#e8f3eb" stroke="#b9d5c3"/><text x="84" y="188" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#174a35">HTML + CSS + JavaScript</text><text x="84" y="207" font-family="Arial,sans-serif" font-size="12" fill="#41614e">Dashboard, transactions, budgets, goals, khata</text><path d="M290 222V246H171V260M290 246H403V260" fill="none" stroke="#648071" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="66" y="266" width="212" height="76" rx="10" fill="#fff8e8" stroke="#e5ca8a"/><text x="82" y="290" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#805d16">IndexedDB</text><text x="82" y="310" font-family="Arial,sans-serif" font-size="12" fill="#6d5b34">Transaction records</text><text x="82" y="327" font-family="Arial,sans-serif" font-size="11" fill="#6d5b34">Browser profile only</text>
<rect x="292" y="266" width="221" height="76" rx="10" fill="#eef3ff" stroke="#b9c9ec"/><text x="308" y="290" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#284b83">localStorage</text><text x="308" y="310" font-family="Arial,sans-serif" font-size="12" fill="#425a7b">Budgets, goals, khata, people</text><text x="308" y="327" font-family="Arial,sans-serif" font-size="11" fill="#425a7b">Preferences and currency</text>
<rect x="583" y="95" width="495" height="285" rx="18" fill="#fff" stroke="#cbd9cf" stroke-width="1.5"/><rect x="583" y="95" width="495" height="48" rx="18" fill="#263b52"/><path d="M583 125H1078V143H583Z" fill="#263b52"/><text x="607" y="125" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Python CLI · finance_tracker/</text>
<rect x="607" y="164" width="447" height="58" rx="10" fill="#edf2f8" stroke="#c5d2e2"/><text x="625" y="188" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#263b52">Click CLI + SQLAlchemy</text><text x="625" y="207" font-family="Arial,sans-serif" font-size="12" fill="#52677d">Terminal commands, reports, search, export</text><path d="M830 222V259" fill="none" stroke="#648071" stroke-width="2" marker-end="url(#arrow)"/><rect x="607" y="266" width="447" height="76" rx="10" fill="#f0f7ef" stroke="#c2d8bc"/><text x="625" y="290" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315d31">SQLite</text><text x="625" y="310" font-family="Arial,sans-serif" font-size="12" fill="#4f6c4d">Default database: ~/.finance_tracker.db</text><text x="625" y="327" font-family="Arial,sans-serif" font-size="11" fill="#4f6c4d">Separate from browser records</text>
<rect x="437" y="222" width="246" height="34" rx="17" fill="#fff0ef" stroke="#e2b2ae"/><text x="560" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#963b34">No sync between interfaces</text>
<rect x="42" y="405" width="1036" height="68" rx="14" fill="#e7f3eb" stroke="#c1d9c8"/><text x="64" y="431" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#174a35">User-managed backups and deployment</text><text x="64" y="451" font-family="Arial,sans-serif" font-size="12" fill="#41614e">CSV = transactions · JSON = browser records/settings · backups are plaintext unless separately encrypted.</text><text x="64" y="466" font-family="Arial,sans-serif" font-size="12" fill="#41614e">GitHub Pages workflow and manual Cloudflare Pages deployment are independent.</text>
</svg>