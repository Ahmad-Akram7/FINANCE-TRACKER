<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#0d1a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1a7a4a"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="60%"  stop-color="#0a0f14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0f14" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#161b22"/>
      <stop offset="100%"  stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#1a2535"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Glow orbs -->
  <ellipse cx="300"  cy="320" rx="380" ry="280" fill="#3fb950" opacity="0.04" filter="url(#glow2)"/>
  <ellipse cx="980"  cy="320" rx="300" ry="200" fill="#1a4a7a" opacity="0.05" filter="url(#glow2)"/>

  <!-- Left edge bar -->
  <rect x="0" y="0" width="5" height="640" fill="url(#accent)"/>

  <!-- Top/bottom rules -->
  <rect x="0"  y="0"   width="1280" height="2" fill="url(#accent)" opacity="0.6"/>
  <rect x="0"  y="638" width="1280" height="2" fill="url(#accent)" opacity="0.3"/>

  <!-- LEFT SIDE: Text content -->

  <!-- Eyebrow -->
  <rect x="72" y="140" width="8" height="8" rx="1" fill="#3fb950"/>
  <text x="90" y="150" font-family="'Courier New', monospace" font-size="13" fill="#3fb950" letter-spacing="4">PYTHON  ·  CLI  ·  OPEN SOURCE</text>

  <!-- Big title -->
  <text x="68" y="270" font-family="Georgia, serif" font-size="110" font-weight="bold"
        fill="#e6edf3" letter-spacing="-4">Finance</text>
  <text x="68" y="385" font-family="Georgia, serif" font-size="110" font-weight="bold"
        font-style="italic" fill="url(#accent)" letter-spacing="-4" filter="url(#glow2)">Tracker</text>

  <!-- Underline -->
  <rect x="68" y="405" width="420" height="3" fill="url(#accent)" rx="1"/>

  <!-- Subtitle -->
  <text x="68" y="448" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e" letter-spacing="0.3">
    Track income, expenses &amp; savings from your terminal.
  </text>
  <text x="68" y="474" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#8b949e">
    No cloud. No subscription. Your data, your machine.
  </text>

  <!-- Badges row -->
  <!-- SQLAlchemy -->
  <rect x="68"  y="508" width="120" height="28" rx="3" fill="#1a2535" stroke="#30363d" stroke-width="1"/>
  <text x="128" y="527" font-family="'Courier New', monospace" font-size="12" fill="#58a6ff" text-anchor="middle">SQLAlchemy</text>

  <!-- Click -->
  <rect x="198" y="508" width="70" height="28" rx="3" fill="#1a2535" stroke="#30363d" stroke-width="1"/>
  <text x="233" y="527" font-family="'Courier New', monospace" font-size="12" fill="#58a6ff" text-anchor="middle">Click</text>

  <!-- Rich -->
  <rect x="278" y="508" width="60" height="28" rx="3" fill="#1a2535" stroke="#30363d" stroke-width="1"/>
  <text x="308" y="527" font-family="'Courier New', monospace" font-size="12" fill="#58a6ff" text-anchor="middle">Rich</text>

  <!-- Pydantic -->
  <rect x="348" y="508" width="88" height="28" rx="3" fill="#1a2535" stroke="#30363d" stroke-width="1"/>
  <text x="392" y="527" font-family="'Courier New', monospace" font-size="12" fill="#58a6ff" text-anchor="middle">Pydantic</text>

  <!-- MIT -->
  <rect x="446" y="508" width="56" height="28" rx="3" fill="#1a3a2a" stroke="#3fb950" stroke-width="1" stroke-opacity="0.5"/>
  <text x="474" y="527" font-family="'Courier New', monospace" font-size="12" fill="#3fb950" text-anchor="middle">MIT</text>

  <!-- Author -->
  <text x="68" y="590" font-family="'Courier New', monospace" font-size="13" fill="#484f58">github.com/Ahmad-Akram7</text>

  <!-- RIGHT SIDE: Mini terminal card -->
  <rect x="720" y="100" width="500" height="440" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>

  <!-- card title bar -->
  <rect x="720" y="100" width="500" height="40" rx="8" fill="#1c2128"/>
  <rect x="720" y="126" width="500" height="14" fill="#1c2128"/>
  <line x1="720" y1="140" x2="1220" y2="140" stroke="#30363d" stroke-width="1"/>
  <circle cx="746" cy="120" r="6" fill="#ff5f57"/>
  <circle cx="766" cy="120" r="6" fill="#febc2e"/>
  <circle cx="786" cy="120" r="6" fill="#28c840"/>
  <text x="970" y="125" font-family="'Courier New', monospace" font-size="11" fill="#484f58" text-anchor="middle">finance-tracker</text>

  <!-- card content -->
  <text x="744" y="170" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">$</text>
  <text x="758" y="170" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3">finance-tracker init</text>
  <text x="758" y="188" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">  ✓  Database initialised.</text>

  <text x="744" y="214" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">$</text>
  <text x="758" y="214" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3">finance-tracker add -t income -a 3500</text>
  <text x="758" y="232" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">  ✓  [INCOME] </text>
  <text x="862" y="232" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">$3,500.00</text>

  <line x1="740" y1="248" x2="1208" y2="248" stroke="#21262d" stroke-width="1"/>

  <!-- mini report block -->
  <text x="744" y="270" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">$</text>
  <text x="758" y="270" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3">finance-tracker report</text>

  <rect x="744" y="280" width="460" height="116" rx="2" fill="#090d12" stroke="#21262d" stroke-width="1"/>
  <text x="756" y="300" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff"> ╔══════════════════════════════════════╗</text>
  <text x="756" y="315" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff"> ║</text>
  <text x="776" y="315" font-family="'Courier New', monospace" font-size="11" fill="#c9d1d9">  📊 Financial Summary            </text>
  <text x="1112" y="315" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff">║</text>
  <text x="756" y="330" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff"> ╠══════════════════════════════════════╣</text>
  <text x="756" y="345" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff"> ║</text>
  <text x="776" y="345" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">  Total Income         </text>
  <text x="1000" y="345" font-family="'Courier New', monospace" font-size="11" fill="#3fb950">$3,500.00</text>
  <text x="1112" y="345" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff">║</text>
  <text x="756" y="360" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff"> ║</text>
  <text x="776" y="360" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">  Net Balance          </text>
  <text x="1000" y="360" font-family="'Courier New', monospace" font-size="11" fill="#3fb950">$3,260.00</text>
  <text x="1112" y="360" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff">║</text>
  <text x="756" y="375" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff"> ║</text>
  <text x="776" y="375" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">  Savings Rate         </text>
  <text x="1016" y="375" font-family="'Courier New', monospace" font-size="11" fill="#d29922">14.3%</text>
  <text x="1112" y="375" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff">║</text>
  <text x="756" y="388" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff"> ╚══════════════════════════════════════╝</text>

  <!-- budget line -->
  <text x="744" y="416" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">$</text>
  <text x="758" y="416" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3">finance-tracker budget Groceries 400</text>
  <text x="758" y="434" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">  </text>
  <!-- progress bar -->
  <rect x="772" y="424" width="200" height="10" rx="2" fill="#1a2535"/>
  <rect x="772" y="424" width="115" height="10" rx="2" fill="#3fb950" opacity="0.8"/>
  <text x="982" y="434" font-family="'Courier New', monospace" font-size="11" fill="#3fb950"> 57%  $170 left</text>

  <!-- cursor -->
  <text x="744" y="464" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">$</text>
  <rect x="758" y="453" width="8" height="13" fill="#3fb950" opacity="0.9"/>

  <!-- fade overlay on right edge -->
  <rect x="1100" y="100" width="120" height="440" fill="url(#fadeR)"/>
</svg>
