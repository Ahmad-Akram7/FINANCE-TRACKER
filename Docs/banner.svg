<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="50%"  stop-color="#0f1e2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1a7a4a"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#3fb950" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#3fb950" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2535" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bgGrad)"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.5"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="200" rx="300" ry="200" fill="#1a7a4a" opacity="0.04"/>
  <ellipse cx="1080" cy="200" rx="250" ry="180" fill="#1a4a7a" opacity="0.06"/>
  <ellipse cx="640" cy="380" rx="400" ry="120" fill="#3fb950" opacity="0.03"/>

  <!-- Top rule line -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#greenGrad)"/>

  <!-- Left decorative bracket -->
  <path d="M 60 100 L 40 100 L 40 300 L 60 300" stroke="#3fb950" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Right decorative bracket -->
  <path d="M 1220 100 L 1240 100 L 1240 300 L 1220 300" stroke="#3fb950" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Version badge -->
  <rect x="80" y="108" width="72" height="22" rx="2" fill="#1a3a2a" stroke="#3fb950" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="116" y="123" font-family="'Courier New', monospace" font-size="10" fill="#3fb950" text-anchor="middle" letter-spacing="1">v2.0.0</text>

  <!-- MIT badge -->
  <rect x="162" y="108" width="52" height="22" rx="2" fill="#1a2a3a" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="188" y="123" font-family="'Courier New', monospace" font-size="10" fill="#58a6ff" text-anchor="middle" letter-spacing="1">MIT</text>

  <!-- Python badge -->
  <rect x="224" y="108" width="72" height="22" rx="2" fill="#1a2035" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="260" y="123" font-family="'Courier New', monospace" font-size="10" fill="#58a6ff" text-anchor="middle" letter-spacing="1">Python</text>

  <!-- Main title: FINANCE -->
  <text x="80" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold"
        fill="#ffffff" letter-spacing="-2" filter="url(#softglow)" opacity="0.08">FINANCE</text>
  <text x="80" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold"
        fill="#ffffff" letter-spacing="-2">FINANCE</text>

  <!-- TRACKER in green italic -->
  <text x="82" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold"
        font-style="italic" fill="url(#greenGrad)" letter-spacing="-2" filter="url(#glow)">TRACKER</text>

  <!-- Horizontal rule under TRACKER -->
  <rect x="80" y="318" width="560" height="1.5" fill="url(#lineGrad)" opacity="0.6"/>

  <!-- Tagline -->
  <text x="80" y="344" font-family="'Courier New', monospace" font-size="13" fill="#8b949e" letter-spacing="3">
    PERSONAL FINANCE  ·  CLI  ·  PYTHON
  </text>

  <!-- Right side: terminal panel -->
  <rect x="760" y="60" width="460" height="290" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal top bar -->
  <rect x="760" y="60" width="460" height="36" rx="6" fill="#1c2128"/>
  <rect x="760" y="78" width="460" height="18" fill="#1c2128"/>
  <!-- dots -->
  <circle cx="786" cy="78" r="6" fill="#ff5f57"/>
  <circle cx="806" cy="78" r="6" fill="#febc2e"/>
  <circle cx="826" cy="78" r="6" fill="#28c840"/>
  <!-- title -->
  <text x="990" y="83" font-family="'Courier New', monospace" font-size="11" fill="#484f58" text-anchor="middle">finance-tracker — zsh</text>
  <!-- divider -->
  <line x1="760" y1="96" x2="1220" y2="96" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal content -->
  <!-- line 1 -->
  <text x="784" y="122" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">$</text>
  <text x="798" y="122" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3">finance-tracker report --period month</text>

  <!-- report output box -->
  <rect x="784" y="132" width="420" height="118" rx="2" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <text x="800" y="152" font-family="'Courier New', monospace" font-size="11" fill="#484f58">  ┌─────────────────────────────────────┐</text>
  <text x="800" y="167" font-family="'Courier New', monospace" font-size="11" fill="#484f58">  │  </text>
  <text x="830" y="167" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">📊  Financial Summary · Month</text>
  <text x="800" y="182" font-family="'Courier New', monospace" font-size="11" fill="#484f58">  ├─────────────────────────────────────┤</text>
  <text x="800" y="197" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">  │  Total Income</text>
  <text x="1070" y="197" font-family="'Courier New', monospace" font-size="11" fill="#3fb950" text-anchor="end">$3,500.00  │</text>
  <text x="800" y="212" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">  │  Total Expenses</text>
  <text x="1070" y="212" font-family="'Courier New', monospace" font-size="11" fill="#f85149" text-anchor="end">$240.00  │</text>
  <text x="800" y="227" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">  │  Net Balance</text>
  <text x="1070" y="227" font-family="'Courier New', monospace" font-size="11" fill="#3fb950" text-anchor="end">$3,260.00  │</text>
  <text x="800" y="242" font-family="'Courier New', monospace" font-size="11" fill="#484f58">  └─────────────────────────────────────┘</text>

  <!-- line 3: budget command -->
  <text x="784" y="272" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">$</text>
  <text x="798" y="272" font-family="'Courier New', monospace" font-size="12" fill="#e6edf3">finance-tracker budget Groceries 400</text>

  <!-- budget bar -->
  <rect x="784" y="282" width="420" height="22" rx="2" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <!-- bar fill -->
  <rect x="790" y="287" width="200" height="12" rx="1" fill="#1a3a2a"/>
  <rect x="790" y="287" width="115" height="12" rx="1" fill="#3fb950"/>
  <text x="1000" y="298" font-family="'Courier New', monospace" font-size="10" fill="#3fb950">57.5%  $170 left</text>

  <!-- cursor line -->
  <text x="784" y="328" font-family="'Courier New', monospace" font-size="12" fill="#3fb950">$</text>
  <rect x="798" y="317" width="8" height="13" fill="#3fb950" opacity="0.9"/>

  <!-- Bottom decorative stats row -->
  <rect x="0" y="370" width="1280" height="30" fill="#0a0f14" opacity="0.8"/>

  <!-- stat items -->
  <text x="80" y="390" font-family="'Courier New', monospace" font-size="11" fill="#3fb950">↑ INCOME</text>
  <text x="155" y="390" font-family="'Courier New', monospace" font-size="11" fill="#484f58">·</text>
  <text x="170" y="390" font-family="'Courier New', monospace" font-size="11" fill="#f85149">↓ EXPENSES</text>
  <text x="260" y="390" font-family="'Courier New', monospace" font-size="11" fill="#484f58">·</text>
  <text x="275" y="390" font-family="'Courier New', monospace" font-size="11" fill="#58a6ff">⊛ SAVINGS</text>
  <text x="360" y="390" font-family="'Courier New', monospace" font-size="11" fill="#484f58">·</text>
  <text x="375" y="390" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">SQLAlchemy 2.0</text>
  <text x="480" y="390" font-family="'Courier New', monospace" font-size="11" fill="#484f58">·</text>
  <text x="495" y="390" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Pydantic v2</text>
  <text x="578" y="390" font-family="'Courier New', monospace" font-size="11" fill="#484f58">·</text>
  <text x="593" y="390" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">Rich · Click</text>
  <text x="660" y="390" font-family="'Courier New', monospace" font-size="11" fill="#484f58">·</text>
  <text x="675" y="390" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">MIT License</text>

  <!-- right side credit -->
  <text x="1200" y="390" font-family="'Courier New', monospace" font-size="11" fill="#3fb950" text-anchor="end">Ahmad Akram</text>

  <!-- Bottom rule -->
  <rect x="0" y="397" width="1280" height="3" fill="url(#greenGrad)"/>
</svg>
