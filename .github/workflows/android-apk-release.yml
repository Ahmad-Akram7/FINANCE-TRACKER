name: Build Android APK and publish GitHub Release

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/android-apk-release.yml"
      - "Docs/ANDROID-APK.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. android-v1.1.0"
        required: true
        default: "android-v1.1.0"

permissions:
  contents: write

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate web app JavaScript
        run: node --check site/assets/js/app.js

      - name: Check required redesigned screens
        run: |
          grep -q 'class="sidebar"' site/index.html
          grep -q 'class="mobile-nav"' site/index.html
          grep -q 'id="reportMonthlyBars"' site/index.html
          grep -q 'id="quickAddDialog"' site/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Configure Android wrapper
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ahmadakram.ledger",
            "appName": "Ledger Finance Tracker",
            "webDir": "site",
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build installable APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ledger-Finance-Tracker.apk

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-Finance-Tracker-APK
          path: Ledger-Finance-Tracker.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || format('android-v1.1.{0}', github.run_number) }}
          name: Ledger Finance Tracker Android ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || format('android-v1.1.{0}', github.run_number) }}
          body: |
            Ledger Finance Tracker Android build.

            - Responsive desktop sidebar and persistent mobile bottom navigation.
            - Quick-entry dialog for transactions.
            - Interactive cash-flow and category charts with month drill-downs.
            - Reports with 6- or 12-month income/expense comparisons.
            - App data remains local to this Android installation and is separate from browser and CLI data.
            - Debug-signed for testing; no production signing key is configured.
          files: Ledger-Finance-Tracker.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
